; Scenario 3 (offline fallback) variant. `[bootstrap] url` matches
; config-reload.json's content.url exactly -- see the smoke README's race note
; for why: boot always navigates the bootstrap url FIRST (a synchronous, local
; decision -- ConfigManager::boot falls back to it before any network fetch
; completes), and the async config fetch against a local fixture httpd is fast
; enough to race that boot navigation and lose (WebKit's second load_uri call
; cancels the first in-flight one before it reaches the network -- confirmed
; empirically, not a kiosk-main bug). Matching the two here removes the race
; instead of asserting against its non-deterministic outcome.
[kiosk]
config_url = http://localhost:8099/config.json
device_id = smoke-01
site = smoke
project_id = smoke-project
credential = kiosk-credential.json
startup_grace_s = 90
healthy_run_s = 120
channel_grace_s = 30
demo_mode = false

[bootstrap]
url = http://localhost:8099/home.html?probe=reload
