; Scenario 5 (iframe blocking) variant. `[bootstrap] url` matches
; config-iframe.json's content.url exactly -- see kiosk-reload.ini's comment
; and the smoke README's race note for why this must match rather than differ.
[kiosk]
config_url = http://localhost:8099/config.json
device_id = smoke-01
site = smoke
project_id = smoke-project
credential = kiosk-credential.json
startup_grace_s = 90
healthy_run_s = 120
channel_grace_s = 30
demo_mode = false

[bootstrap]
url = http://localhost:8099/iframe-host.html
