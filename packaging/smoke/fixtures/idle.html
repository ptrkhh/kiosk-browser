<!doctype html>
<html>
  <body>
    <p>idle probe</p>
    <script>
      var hadCookie = document.cookie.indexOf('kiosk_probe=1') !== -1;
      fetch('/probe?idle=' + (hadCookie ? 'before' : 'absent')).catch(function () {});
      document.cookie = 'kiosk_probe=1; path=/';
      fetch('/probe?idle=set').catch(function () {});
    </script>
  </body>
</html>
