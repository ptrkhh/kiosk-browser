; P2-A smoke harness bootstrap config. Points at the local fixture httpd
; (packaging/smoke/run-smoke.sh's serve_fixtures, port 8099). Self-contained: no
; external network, no CDN.
[kiosk]
config_url = http://localhost:8099/config.json
device_id = smoke-01
site = smoke
project_id = smoke-project
credential = kiosk-credential.json
startup_grace_s = 90
healthy_run_s = 120
channel_grace_s = 30
demo_mode = false

[bootstrap]
url = http://localhost:8099/home.html
