<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>kiosk — offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- kiosk-offline.mp4 is a runtime deployment asset placed next to kiosk.ini (spec
         §3.4), served by kiosk-main's `kioskasset` custom URI scheme (NOT embedded in
         this bundle). Windows origin form: http://<scheme>.localhost/<path>. -->
    <video
      id="offline-video"
      preload="auto"
      autoplay
      muted
      playsinline
      loop
    ></video>
    <script>
      // arch-09 decode-failure robustness (spec §3.4): a corrupt/incompatible codec, a
      // missing platform decoder, or a missing file must degrade to the black "offline"
      // splash — this page's own black background — never a hung/frozen frame. The
      // <video> is simply hidden; the body stays black. Native looping is intentional:
      // WebView2 does not reliably make a display:none second video ready for a manual
      // double-buffer handoff, which can otherwise turn a healthy first loop into black.
      (function () {
        var front = document.getElementById("offline-video");
        var degraded = false;
        var ticks = 0;
        var lastT = 0;
        var wrapAt = 0;
        var misses = 0;

        function report(kind, at, msSinceWrap) {
          try {
            var internals = window.__TAURI_INTERNALS__;
            if (internals && typeof internals.invoke === "function") {
              internals.invoke("media_error", {
                kind: kind,
                at: typeof at === "number" ? at : 0,
                msSinceWrap:
                  typeof msSinceWrap === "number" ? msSinceWrap : null,
              });
            }
          } catch (_) {
            // Telemetry is observation only; the black fallback must still win.
          }
        }

        function fallback(kind, at, msSinceWrap) {
          if (degraded) return;
          degraded = true;
          front.style.display = "none";
          report(kind, at, msSinceWrap);
          console.error("media.error:", kind);
        }

        function watch(video) {
          video.addEventListener("error", function () {
            fallback("error", video.currentTime, Date.now() - wrapAt);
          });
          video.addEventListener("stalled", function () {
            fallback("stalled", video.currentTime, Date.now() - wrapAt);
          });
          video.addEventListener("timeupdate", function () {
            if (video !== front || degraded) return;
            if (video.currentTime < lastT) wrapAt = Date.now();
            lastT = video.currentTime;
            ticks++;
          });
        }

        watch(front);
        // The asset origin differs per platform (`http://kioskasset.localhost` on
        // Windows, `kioskasset://localhost` on Linux/WebKitGTK). Chosen page-locally
        // from the origin this page itself was served from — no serve-time templating.
        var source =
          location.protocol === "tauri:"
            ? "kioskasset://localhost/kiosk-offline.mp4"
            : "http://kioskasset.localhost/kiosk-offline.mp4";
        front.src = source;

        // Autoplay policy is satisfied by muted+playsinline, but honor the rejection.
        var p = front.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {
            fallback("play_rejected", front.currentTime, Date.now() - wrapAt);
          });
        }

        // Startup watchdog: a page that never emits engine activity is not healthy.
        setTimeout(function () {
          if (!degraded && ticks === 0) {
            fallback("no_progress", front.currentTime, Date.now() - wrapAt);
          }
        }, 3000);

        // Loop watchdog: count engine activity, not currentTime samples. This catches
        // the WebKit loop-boundary stall even when currentTime is repeatedly 0.0.
        setInterval(function () {
          if (degraded || front.paused) {
            misses = 0;
            return;
          }
          if (ticks > 0) {
            ticks = 0;
            misses = 0;
            return;
          }
          if (++misses >= 2) {
            fallback("stall", front.currentTime, Date.now() - wrapAt);
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
