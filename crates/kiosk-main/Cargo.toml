[package]
name = "kiosk-main"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiosk-core.workspace = true
tauri = { version = "2", features = [] }
# "net" is what brings in `tokio::net::windows::named_pipe` — the heartbeat
# client's transport to the launcher (P1-E2 Task 5). "io-util" gates
# `AsyncWriteExt`/`AsyncReadExt`, which heartbeat.rs uses directly by name;
# declared explicitly rather than relying on it arriving transitively via
# reqwest/tauri's own tokio feature selection (the crate happens to still
# build without it today, but that's incidental, not a guarantee).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"                      # CancellationToken
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] } # Utc::now() for maintenance::run
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
sysinfo = "0.32.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  # SEC-09 credential-DACL read (credential_acl.rs): GetNamedSecurityInfoW,
  # ConvertSidToStringSidW, the ACE/ACL types, and the FILE_*_READ access
  # masks used to classify an ACE as read-granting.
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
] }

# Linux/WebKitGTK. Justified by exactly four signals plus one callback that have no wry
# or Tauri route: load-changed, load-failed, load-failed-with-tls-errors,
# web-process-terminated, and WebsiteDataManagerExtManual::clear's completion callback.
# Version is the one already in our lock via wry; Cargo unifies semver-compatible
# requirements to one crate, so `PlatformWebview::inner()`'s type and ours cannot
# diverge. `v2_16` is what `clear` needs, but `web-process-terminated`'s
# `WebProcessTerminationReason`/`connect_web_process_terminated` are gated on `v2_20`
# in the vendored webkit2gtk 2.0.2 source (auto/enums.rs, auto/web_view.rs) — features
# are cumulative, so requesting `v2_20` alone covers both needs. glib/gio arrive as
# `webkit2gtk::glib` / `webkit2gtk::gio` re-exports — no new direct deps.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_20"] }

[dev-dependencies]
tempfile = "3"
# Test-only: the RSA keypair for telemetry's Logger/TokenSource tests is
# generated at run time, mirroring kiosk-core's own auth.rs tests — never a
# committed fixture (a `-----BEGIN PRIVATE KEY-----` in the repo is the
# highest-signal pattern secret scanners hunt for).
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
